<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataRoute AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>DataRoute AI</h1>
            <p>Multi-Cloud Egress Cost Minimizer & Dynamic Proxy Router</p>
        </header>

        <section class="card">

            <h2>Route Optimization</h2>

            <div class="form-group">
                <label for="source">Source Region</label>

                <select id="source">
                    <option value="AWS_SIN">AWS Singapore</option>
                    <option value="AWS_MUM">AWS Mumbai</option>
                    <option value="AWS_HYD">AWS Hyderabad</option>

                    <option value="GCP_MUM">GCP Mumbai</option>
                    <option value="GCP_DEL">GCP Delhi</option>
                    <option value="GCP_SIN">GCP Singapore</option>

                    <option value="AZURE_CIN">Azure Central India</option>
                    <option value="AZURE_SIN">Azure South India</option>
                    <option value="AZURE_SEA">Azure Southeast Asia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="destination">Destination Region</label>

                <select id="destination">
                    <option value="AWS_MUM">AWS Mumbai</option>
                    <option value="AWS_HYD">AWS Hyderabad</option>
                    <option value="AWS_SIN">AWS Singapore</option>

                    <option value="GCP_MUM">GCP Mumbai</option>
                    <option value="GCP_DEL">GCP Delhi</option>
                    <option value="GCP_SIN">GCP Singapore</option>

                    <option value="AZURE_CIN">Azure Central India</option>
                    <option value="AZURE_SIN">Azure South India</option>
                    <option value="AZURE_SEA">Azure Southeast Asia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="volume">Traffic Volume (GB)</label>

                <input
                    type="number"
                    id="volume"
                    value="500"
                    min="0.01"
                    step="0.01"
                >
            </div>

            <h3>Optimization Priority</h3>

            <div class="priority">
                <label>
                    Cost
                    <span id="costValue">33%</span>
                </label>

                <input
                    type="range"
                    id="cost"
                    min="0"
                    max="100"
                    value="33"
                >
            </div>

            <div class="priority">
                <label>
                    Latency
                    <span id="latencyValue">34%</span>
                </label>

                <input
                    type="range"
                    id="latency"
                    min="0"
                    max="100"
                    value="34"
                >
            </div>

            <div class="priority">
                <label>
                    Reliability
                    <span id="reliabilityValue">33%</span>
                </label>

                <input
                    type="range"
                    id="reliability"
                    min="0"
                    max="100"
                    value="33"
                >
            </div>

            <button id="optimizeButton">
                Find Best Route
            </button>

        </section>


        <section id="result" class="card result hidden">

            <h2>Recommended Route</h2>

            <div id="route"></div>

            <div class="metrics">

                <div>
                    <span>Cost</span>
                    <strong id="costResult"></strong>
                </div>

                <div>
                    <span>Latency</span>
                    <strong id="latencyResult"></strong>
                </div>

                <div>
                    <span>Reliability</span>
                    <strong id="reliabilityResult"></strong>
                </div>

            </div>

            <p id="explanation"></p>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
